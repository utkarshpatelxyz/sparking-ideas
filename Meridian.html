<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meridian — Engineer Review Tool</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-periwinkle: #7B9FE0; --bg-royal: #4A6CF7; --bg-violet: #7C3AED;
            --bg-magenta: #C026D3; --bg-pink: #EC4899; --bg-coral: #FF6B6B;
            --text-dark: rgba(20, 20, 35, 0.9);
            --icon-base: 96px;
            --mac-ease: cubic-bezier(0.25, 1, 0.5, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-font-smoothing: antialiased; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            height: 100vh; width: 100vw; overflow: hidden;
            display: flex; justify-content: center; align-items: center;
            background: #fff;
        }

        /* --- DYNAMIC LIQUID MESH BACKGROUND --- */
        .bg-layer {
            position: fixed; inset: 0; z-index: -1;
            filter: blur(100px); background: #fff;
            overflow: hidden; transform: scale(1.1);
        }

        .blob { position: absolute; border-radius: 50%; opacity: 0.7; will-change: transform; }
        .b1 { width: 900px; height: 900px; background: radial-gradient(circle, var(--bg-periwinkle), transparent); top: -10%; left: -10%; animation: move-1 35s infinite linear; }
        .b2 { width: 800px; height: 800px; background: radial-gradient(circle, var(--bg-royal), transparent); top: 20%; right: -20%; animation: move-2 42s infinite linear; }
        .b3 { width: 1000px; height: 1000px; background: radial-gradient(circle, var(--bg-violet), transparent); bottom: -20%; left: 0%; animation: move-3 38s infinite linear; }
        .b4 { width: 700px; height: 700px; background: radial-gradient(circle, var(--bg-magenta), transparent); bottom: 10%; right: 10%; animation: move-1 28s infinite linear reverse; }
        .b5 { width: 600px; height: 600px; background: radial-gradient(circle, var(--bg-coral), transparent); top: 40%; left: 40%; animation: move-2 45s infinite linear reverse; }

        @keyframes move-1 { 0% { transform: translate(0, 0) rotate(0deg); } 33% { transform: translate(150px, 100px) rotate(120deg); } 66% { transform: translate(-100px, 200px) rotate(240deg); } 100% { transform: translate(0, 0) rotate(360deg); } }
        @keyframes move-2 { 0% { transform: translate(0, 0) rotate(0deg); } 50% { transform: translate(-200px, -150px) rotate(-180deg); } 100% { transform: translate(0, 0) rotate(-360deg); } }
        @keyframes move-3 { 0% { transform: translate(0, 0); } 25% { transform: translate(200px, -100px); } 50% { transform: translate(50px, -300px); } 75% { transform: translate(-150px, -100px); } 100% { transform: translate(0, 0); } }

        /* --- BRANDING & HERO --- */
        .logo { position: fixed; top: 28px; left: 36px; font-size: 22px; font-weight: 800; color: var(--text-dark); opacity: 0; animation: fIn 0.8s forwards 0.2s; z-index: 1000; }
        .hero { font-size: clamp(28px, 4vw, 46px); font-weight: 400; color: var(--text-dark); margin-bottom: 60px; opacity: 0; transform: translateY(20px); animation: fInUp 0.8s forwards 0.4s; text-align: center; }

        /* --- THE DOCK --- */
        .dock-container { opacity: 0; transform: translateY(40px); animation: fInUp 0.9s var(--mac-ease) forwards 0.7s; transform-origin: bottom center; }
        .dock {
            display: flex; align-items: flex-end; padding: 12px 20px; gap: 10px;
            background: rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(40px) saturate(1.8); -webkit-backdrop-filter: blur(40px) saturate(1.8);
            border-radius: 32px; border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 20px 50px rgba(0,0,0,0.1), inset 0 1px 1px rgba(255,255,255,0.7);
            height: 128px;
        }

        .dock-item {
            position: relative; display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
            width: var(--icon-base); height: 100%; will-change: width;
        }

        .dock-item.resetting, .dock-item.resetting .dock-icon, .dock-item.resetting .tooltip {
            transition: all 0.4s var(--mac-ease) !important;
        }

        .tooltip {
            position: absolute; bottom: 112px;
            background: rgba(30, 30, 35, 0.95); color: white;
            padding: 6px 14px; border-radius: 10px; font-size: 13px; font-weight: 600;
            white-space: nowrap; opacity: 0; transform: translateY(10px);
            transition: opacity 0.2s; pointer-events: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 30;
        }
        .tooltip::after { content: ''; position: absolute; bottom: -5px; left: 50%; transform: translateX(-50%); border: 6px solid transparent; border-top-color: rgba(30, 30, 35, 0.95); }
        .dock-item:hover .tooltip { opacity: 1; transform: translateY(0); }

        .dock-icon {
            width: var(--icon-base); height: var(--icon-base);
            border-radius: 22px; display: flex; align-items: center; justify-content: center;
            transform-origin: bottom center; position: relative; overflow: hidden;
            box-shadow: 
                inset 1.5px 0 1.5px rgba(255,255,255,0.6),
                inset -1.5px 0 1.5px rgba(255,255,255,0.6), 
                inset 0 -4px 10px rgba(0,0,0,0.15),        
                0 8px 18px rgba(0,0,0,0.18);               
            border: 0.5px solid rgba(255,255,255,0.25);
            z-index: 2; will-change: transform;
        }

        .dock-icon::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 45%; background: linear-gradient(rgba(255,255,255,0.35), transparent); pointer-events: none; }
        .dock-icon svg { width: 72%; height: 72%; stroke: white; stroke-width: 1.5; fill: none; filter: drop-shadow(0 2px 3px rgba(0,0,0,0.3)); }

        .icon-drum    { background: linear-gradient(145deg, #2a52be, #16222a); }
        .icon-column  { background: linear-gradient(145deg, #00b09b, #96c93d); }
        .icon-reactor { background: linear-gradient(145deg, #f12711, #f5af19); }
        .icon-tank     { background: linear-gradient(145deg, #6a11cb, #2575fc); }
        .icon-sphere   { background: linear-gradient(145deg, #4facfe, #00f2fe); }

        .tagline { margin-top: 50px; font-size: 22px; opacity: 0; animation: fIn 1s forwards 1.2s; }
        .t-fixed { font-weight: 600; color: #1a1a28; }
        .t-dyn { color: #4a4af7; font-weight: 400; }
        .cursor { display: inline-block; width: 2px; height: 1.1em; background: #4a4af7; margin-left: 2px; vertical-align: text-bottom; animation: blink 0.8s step-end infinite; }

        @keyframes fIn { to { opacity: 1; } }
        @keyframes fInUp { to { opacity: 1; transform: translateY(0); } }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

        /* --- FADE OUT TEXT --- */
        .hero, .tagline { transition: opacity 0.35s ease; }
        .hero.hidden, .tagline.hidden { opacity: 0 !important; pointer-events: none; }

        /* --- BOUNCE ANIMATION --- */
        @keyframes macBounce {
            0%   { transform: scale(1) translateY(0); }
            20%  { transform: scale(1) translateY(-28px); }
            40%  { transform: scale(1) translateY(0); }
            60%  { transform: scale(1) translateY(-14px); }
            80%  { transform: scale(1) translateY(0); }
            100% { transform: scale(1) translateY(0); }
        }
        .bounce-icon { animation: macBounce 0.8s cubic-bezier(0.36, 0.07, 0.19, 0.97) forwards !important; }

        /* --- GENIE CANVAS OVERLAY --- */
        #genie-canvas {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 500;
            display: none;
        }

        /* --- FULL SCREEN APP WINDOW --- */
        #app-window {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100vh;
            z-index: 600;
            display: none;
            background-size: cover;
            background-position: center;
            flex-direction: column;
            align-items: flex-start;
            justify-content: flex-start;
        }
        #app-window .app-logo {
            position: absolute;
            top: 28px;
            left: 36px;
            font-size: 22px;
            font-weight: 800;
            color: rgba(255,255,255,0.95);
            font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
            text-shadow: 0 2px 12px rgba(0,0,0,0.4);
        }
    </style>
</head>

        <div class="blob b3"></div><div class="blob b4"></div><div class="blob b5"></div>

    <div class="logo">Meridian</div>

                </div>
            </div>
        </div>

        <p class="tagline">
            <span class="t-fixed">Use Meridian </span>
            <span class="t-dyn" id="dynText"></span>
            <span class="cursor"></span>
        </p>
    </div>

    <!-- Genie canvas for the morphing animation -->
    <canvas id="genie-canvas"></canvas>

        <div class="app-logo">Meridian</div>
    </div>

        const dock = document.getElementById('dock');
        const items = document.querySelectorAll('.dock-item');
        const baseSize = 96;
        const maxScale = 1.5;
        const proximity = 260;
        let dockMoved = false;

        document.addEventListener('mousemove', (e) => {
            if (dockMoved) return;
            const mouseX = e.clientX;
            const dockRect = dock.getBoundingClientRect();
            if (e.clientY > dockRect.top - 180 && e.clientY < dockRect.bottom + 150) {
                items.forEach(item => {
                    item.classList.remove('resetting');
                    const rect = item.getBoundingClientRect();
                    const centerX = rect.left + rect.width / 2;
                    const distance = Math.abs(mouseX - centerX);
                    let scale = 1;
                    if (distance < proximity) {
                        const norm = distance / proximity;
                        scale = 1 + (maxScale - 1) * Math.exp(-(norm * norm) / 0.20);
                    }
                    const icon = item.querySelector('.dock-icon');
                    const tooltip = item.querySelector('.tooltip');
                    icon.style.transform = `scale(${scale})`;
                    item.style.width = `${baseSize * scale}px`;
                    tooltip.style.bottom = `${112 + (scale - 1) * 55}px`;
                });
            } else {
                reset();
            }
        });

        dock.addEventListener('mouseleave', reset);

        function reset() {
            items.forEach(item => {
                item.classList.add('resetting');
                item.style.width = `${baseSize}px`;
                item.querySelector('.dock-icon').style.transform = `scale(1)`;
                item.querySelector('.tooltip').style.bottom = `112px`;
            });
        }

        /* ============================================================
           ICON CLICK — Phase 1: dock slides down
        ============================================================ */
        items.forEach(item => {
            item.addEventListener('click', () => {
                if (dockMoved) return;
                dockMoved = true;

                const hero     = document.querySelector('.hero');
                const tagline  = document.querySelector('.tagline');
                const dockContainer = document.querySelector('.dock-container');
                const clickedIcon   = item.querySelector('.dock-icon');

                // Fade out hero text
                hero.classList.add('hidden');
                tagline.classList.add('hidden');

                // Animate dock down while shrinking
                const finalScale = 0.5;
                const containerRect = dockContainer.getBoundingClientRect();
                const dockFinalHeight = containerRect.height * finalScale;
                const gap = 18;
                const translateY = window.innerHeight - containerRect.bottom - gap + (containerRect.height - dockFinalHeight) / 2;

                const dockAnim = dockContainer.animate([
                    { transform: `translateY(0px) scale(1)`,                         opacity: 1 },
                    { transform: `translateY(${translateY * 0.5}px) scale(0.75)`,    opacity: 1, offset: 0.5 },
                    { transform: `translateY(${translateY}px) scale(${finalScale})`, opacity: 1 }
                ], {
                    duration: 750,
                    easing: 'cubic-bezier(0.25, 1, 0.5, 1)',
                    fill: 'forwards'
                });

                // Phase 2: bounce, then genie
                dockAnim.onfinish = () => {
                    reset();
                    setTimeout(() => {
                        clickedIcon.classList.add('bounce-icon');
                        clickedIcon.addEventListener('animationend', () => {
                            clickedIcon.classList.remove('bounce-icon');
                            // Phase 3: Genie effect
                            startGenieEffect(clickedIcon);
                        }, { once: true });
                    }, 80);
                };
            });
        });

        /* ============================================================
           GENIE EFFECT — canvas-based morph from icon to fullscreen
        ============================================================ */
        function startGenieEffect(iconEl) {
            const canvas  = document.getElementById('genie-canvas');
            const ctx     = canvas.getContext('2d');
            const W       = window.innerWidth;
            const H       = window.innerHeight;
            canvas.width  = W;
            canvas.height = H;
            canvas.style.display = 'block';

            // Wallpaper image
            const wallpaper = new Image();
            wallpaper.src = WALLPAPER_SRC;

            // Icon bounding box in screen space
            const iconRect = iconEl.getBoundingClientRect();
            const src = {
                x: iconRect.left,
                y: iconRect.top,
                w: iconRect.width,
                h: iconRect.height
            };
            const dst = { x: 0, y: 0, w: W, h: H };

            const DURATION = 900; // ms
            const SLICES   = 120;  // horizontal slices for mesh distortion
            let   start    = null;

            wallpaper.onload = () => {
                function lerp(a, b, t) { return a + (b - a) * t; }

                // easeInOutCubic
                function ease(t) {
                    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
                }

                // Genie-style: bottom of shape expands from icon position,
                // top of shape flies up to full screen.
                // At t=0 → tiny icon rect; at t=1 → full screen.
                //
                // The genie splits into SLICES horizontal strips.
                // Each slice's left & right edges warp from a pinched origin (the icon)
                // outward to full width, with the bottom strips leading the expansion
                // (they get a head start).

                function getSliceQuad(slice, t) {
                    // Progress offset: bottom slices start earlier (Mac genie feel)
                    const sliceT = Math.min(1, Math.max(0, (t * 1.4) - (slice / SLICES) * 0.4));
                    const et = ease(sliceT);

                    // Y boundaries of this slice in destination (full screen)
                    const yTop    = lerp(0, dst.h, slice / SLICES);
                    const yBottom = lerp(0, dst.h, (slice + 1) / SLICES);

                    // X boundaries: start pinched at icon center X, expand to 0 and W
                    const iconCX = src.x + src.w / 2;
                    const xLeft  = lerp(iconCX, dst.x,        et);
                    const xRight = lerp(iconCX, dst.x + dst.w, et);

                    // Y boundaries: start compressed at icon Y, expand to screen Y
                    const iconCY = src.y + src.h / 2;
                    const yTopActual    = lerp(iconCY, yTop,    et);
                    const yBottomActual = lerp(iconCY, yBottom, et);

                    return { xLeft, xRight, yTopActual, yBottomActual, et };
                }

                function draw(timestamp) {
                    if (!start) start = timestamp;
                    const elapsed = timestamp - start;
                    const t = Math.min(elapsed / DURATION, 1);

                    ctx.clearRect(0, 0, W, H);

                    // Draw each horizontal slice as a trapezoid using canvas clip + drawImage
                    for (let s = 0; s < SLICES; s++) {
                        const q = getSliceQuad(s, t);
                        const { xLeft, xRight, yTopActual, yBottomActual, et } = q;

                        if (xRight - xLeft < 0.5) continue;

                        // Source rectangle within the wallpaper for this slice
                        const srcYTop    = (s / SLICES) * H;
                        const srcYBottom = ((s + 1) / SLICES) * H;

                        ctx.save();
                        // Clip to the trapezoid for this slice
                        ctx.beginPath();
                        ctx.moveTo(xLeft,  yTopActual);
                        ctx.lineTo(xRight, yTopActual);
                        ctx.lineTo(xRight, yBottomActual);
                        ctx.lineTo(xLeft,  yBottomActual);
                        ctx.closePath();
                        ctx.clip();

                        // Draw the corresponding horizontal strip of the wallpaper
                        // We draw the full wallpaper scaled to canvas size, clipping handles the strip
                        ctx.globalAlpha = Math.min(1, et * 1.5);
                        ctx.drawImage(
                            wallpaper,
                            0, srcYTop,           // source x, y
                            wallpaper.width, srcYBottom - srcYTop, // source w, h
                            xLeft, yTopActual,    // dest x, y
                            xRight - xLeft, yBottomActual - yTopActual // dest w, h
                        );

                        ctx.restore();
                    }

                    if (t < 1) {
                        requestAnimationFrame(draw);
                    } else {
                        // Genie done — show real app window and hide canvas
                        canvas.style.display = 'none';
                        const appWin = document.getElementById('app-window');
                        appWin.style.backgroundImage = `url(${WALLPAPER_SRC})`;
                        appWin.style.display = 'flex';

                        // Fade in app window instantly (it's already at full size)
                        appWin.style.opacity = '0';
                        appWin.style.transition = 'opacity 0.15s ease';
                        requestAnimationFrame(() => { appWin.style.opacity = '1'; });
                    }
                }

                requestAnimationFrame(draw);
            };

            // If image already cached, fire manually
            if (wallpaper.complete) wallpaper.onload();
        }

        /* ============================================================
           TYPING TAGLINE
        ============================================================ */
        const phrases = ["as your co-pilot", "to ease the review task", "for a systematic review", "for smarter engineering reviews"];
        let pIdx = 0, cIdx = 0, isDel = false;
        const dyn = document.getElementById('dynText');
        function type() {
            const full = phrases[pIdx];
            dyn.textContent = isDel ? full.substring(0, cIdx--) : full.substring(0, cIdx++);
            let speed = isDel ? 35 : 55;
            if (!isDel && cIdx > full.length) { isDel = true; speed = 2000; }
            else if (isDel && cIdx < 0) { isDel = false; pIdx = (pIdx + 1) % phrases.length; cIdx = 0; speed = 500; }
            setTimeout(type, speed);
        }
        type();
    </script>
</body>
</html>
