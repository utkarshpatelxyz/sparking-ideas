<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AntarMan (अंतर्मन) — Your Inner Voice. An empathetic AI companion for India." />
  <title>AntarMan | अंतर्मन — Your Inner Voice</title>

  <!-- Google Fonts: Plus Jakarta Sans (Latin) + Noto Sans Devanagari (Hindi) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Noto+Sans+Devanagari:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  />

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', '"Noto Sans Devanagari"', 'system-ui', 'sans-serif'],
          },
          colors: {
            ember: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            },
            maroon: {
              700: '#7f1d1d',
              800: '#6b1a1a',
              900: '#450a0a',
            },
          },
        },
      },
    };
  </script>

  <!-- Custom overrides & micro-interactions -->
  <link rel="stylesheet" href="style.css" />
</head>

<body class="bg-neutral-950 text-neutral-200 font-sans antialiased h-screen flex flex-col overflow-hidden">

  <!-- ============================================ -->
  <!-- TOP HEADER BAR                               -->
  <!-- ============================================ -->
  <header class="shrink-0 border-b border-neutral-800 bg-neutral-900/80 backdrop-blur-md z-20">
    <div class="max-w-4xl mx-auto px-4 py-3 flex items-center justify-between gap-4">
      <div class="flex items-center gap-3 min-w-0">
        <!-- Logo mark -->
        <div class="h-10 w-10 shrink-0 rounded-xl bg-gradient-to-br from-amber-500 via-amber-600 to-red-900 flex items-center justify-center shadow-lg shadow-amber-900/30 ring-1 ring-amber-500/40">
          <span class="text-xl select-none" aria-hidden="true">🪔</span>
        </div>
        <div class="min-w-0">
          <h1 class="text-lg sm:text-xl font-bold tracking-tight text-neutral-50 truncate">
            AntarMan <span class="text-amber-400">|</span> <span class="text-amber-300">अंतर्मन</span>
          </h1>
          <p class="text-xs text-neutral-400 truncate">
            Your Inner Voice <span class="text-neutral-600">/</span> आपकी आंतरिक आवाज़
          </p>
        </div>
      </div>

      <!-- Clear Conversation History button -->
      <button
        id="clear-btn"
        type="button"
        class="glow-btn shrink-0 inline-flex items-center gap-2 rounded-lg border border-neutral-700 bg-neutral-800/70 px-3 py-2 text-xs sm:text-sm font-semibold text-neutral-300 transition-all duration-200 hover:border-amber-500/60 hover:text-amber-300 hover:bg-neutral-800 focus:outline-none"
        title="Clear Conversation History"
      >
        <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
        <span class="hidden sm:inline">Clear Conversation History</span>
        <span class="sm:hidden">Clear</span>
      </button>
    </div>
  </header>

  <!-- ============================================ -->
  <!-- CHAT HISTORY DISPLAY AREA                    -->
  <!-- ============================================ -->
  <main
    id="chat-container"
    class="flex-1 overflow-y-auto scroll-smooth"
    aria-live="polite"
  >
    <div id="chat-list" class="max-w-4xl mx-auto px-4 py-6 flex flex-col gap-4">
      <!-- Welcome message (rendered on load & after clearing, from script.js) -->
    </div>
  </main>

  <!-- ============================================ -->
  <!-- STICKY BOTTOM INPUT BAR                      -->
  <!-- ============================================ -->
  <footer class="shrink-0 sticky bottom-0 border-t border-neutral-800 bg-neutral-900/90 backdrop-blur-md z-20">
    <div class="max-w-4xl mx-auto px-4 py-3">
      <form id="chat-form" class="flex items-end gap-3" autocomplete="off">
        <div class="relative flex-1">
          <textarea
            id="user-input"
            rows="1"
            maxlength="8000"
            placeholder="Apne mann ki baat likhiye… / अपने मन की बात लिखिए… / Type your message…"
            class="glow-input w-full resize-none rounded-xl border border-neutral-700 bg-neutral-800/80 px-4 py-3 pr-4 text-sm sm:text-base text-neutral-100 placeholder-neutral-500 outline-none transition-all duration-200"
            aria-label="Message input"
          ></textarea>
        </div>
        <button
          id="send-btn"
          type="submit"
          class="glow-btn send-btn shrink-0 inline-flex items-center gap-2 rounded-xl bg-gradient-to-br from-amber-500 to-red-900 px-4 sm:px-5 py-3 text-sm sm:text-base font-bold text-neutral-950 transition-all duration-200 hover:brightness-110 active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:hover:brightness-100 focus:outline-none"
          aria-label="Send message"
        >
          <span class="hidden sm:inline">Send</span>
          <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" viewBox="0 0 20 20" fill="currentColor" aria-hidden="true">
            <path d="M10.894 2.553a1 1 0 00-1.788 0l-7 14a1 1 0 001.169 1.409l5-1.429A1 1 0 009 15.571V11a1 1 0 112 0v4.571a1 1 0 00.725.962l5 1.428a1 1 0 001.17-1.408l-7-14z" />
          </svg>
        </button>
      </form>
      <p class="mt-2 text-center text-[11px] text-neutral-600">
        AntarMan ek AI saathi hai — mahatvapurna faislon ke liye kripya visheshagyon se salah lein.
        <span class="text-neutral-700">|</span>
        Press <kbd class="rounded border border-neutral-700 bg-neutral-800 px-1 text-neutral-400">Enter</kbd> to send,
        <kbd class="rounded border border-neutral-700 bg-neutral-800 px-1 text-neutral-400">Shift+Enter</kbd> for a new line.
      </p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
