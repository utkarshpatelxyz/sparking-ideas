        column-gap: 8px;
        row-gap: 16px;
        width: 100%;

      .mrd-icon-cell {
        display: flex;
        flex-direction: column;
        align-items: center;
        cursor: pointer;

        user-select: none;

        width: 52px;
        height: 52px;
        border-radius: 12px;
        display: flex;
        align-items: center;
        justify-content: center;
        position: relative;
        overflow: hidden;
        flex-shrink: 0;

        overflow: hidden;

        overflow: hidden;
        display: flex;
        flex-direction: column;

        align-items: center;
        padding: 0 14px;

      .mrd-header-more { font-size:14px; color:rgba(255,255,255,0.40); letter-spacing:2px; cursor:pointer; }

      .mrd-export-name { font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
      .mrd-export-time { font-size:10px; color:rgba(255,255,255,0.45); margin-top:2px; }
      .mrd-download-btn {

      .mrd-block3-footer { height:24px; background:rgba(20,8,2,0.60); border-top:1px solid rgba(255,255,255,0.04); display:flex; align-items:center; padding:0 12px; flex-shrink:0; }

      .mrd-tab {

      /* Slide animation */

      @keyframes mrdSlideIn  { from{opacity:0;transform:translateX(38px)} to{opacity:1;transform:translateX(0)} }
      @keyframes mrdSlideOut { from{opacity:1;transform:translateX(0)} to{opacity:0;transform:translateX(-38px)} }
      .mrd-slide-enter-rev { animation: mrdSlideInRev 0.32s cubic-bezier(0.4,0,0.2,1); }

      .mrd-checkpoint-num {
        font-size: 11px;
        font-weight: 700;

      .mrd-checkpoint-text {
        font-size: 17px;
        font-weight: 600;
        color: #1c1c1e;
        line-height: 1.5;
        margin-bottom: 28px;

      /* Action buttons: N/A | Pending | Reviewed */
      .mrd-action-row {
        display: flex;
        gap: 10px;
        position: absolute;
        right: 36px;
        top: 36px;
      }
      .mrd-action-btn {
        padding: 8px 18px;
        border-radius: 22px;
        border: none;
        font-size: 13px;
        font-weight: 700;
        cursor: pointer;
        font-family: inherit;
        background: #2563EB;
        color: #fff;
        transition: all 0.18s;
        box-shadow: 0 2px 8px rgba(37,99,235,0.3);

      .mrd-action-btn.selected-pending { background:#f59e0b; box-shadow:0 2px 8px rgba(245,158,11,0.4); }
      .mrd-action-btn.selected-reviewed{ background:#16a34a; box-shadow:0 2px 8px rgba(22,163,74,0.4); }

      .mrd-clear-btn {
        background: none;
        border: 1px solid rgba(0,0,0,0.15);
        border-radius: 6px;
        font-size: 10px;
        color: rgba(0,0,0,0.4);
        padding: 3px 8px;
        cursor: pointer;

        transition: all 0.15s;

      .mrd-bottom-bar {
        padding: 16px 36px 20px;

        background: none;
        border: 1.5px solid rgba(0,0,0,0.18);

        font-weight: 600;

      .mrd-status-chip {

    </style>

    // ═══════════════════════════════════════════════════════
    //  STATE
    // ═══════════════════════════════════════════════════════
    const mrdState = {
      activeIconIdx: 0,
      activeCheckIdx: 0,
      answers: {}, // key: "iconIdx-checkIdx", value: "na"|"pending"|"reviewed"
      exports: []  // [{name, time, data, blob}]
    };

    // ═══════════════════════════════════════════════════════
    //  BUILD ICON GRID
    // ═══════════════════════════════════════════════════════
    function mrdBuildGrid() {
      const grid = document.getElementById('mrd-icon-grid');
      grid.innerHTML = MRD_ICONS.map((ico, i) => `
        <div class="mrd-icon-cell" onclick="mrdOpenIcon(${i})" id="mrd-cell-${i}">
          <div class="mrd-icon-square" style="background:${ico.gradient};">${ico.svg}</div>
          <span class="mrd-icon-label">${ico.label}</span>
        </div>
      `).join('');
    }

    // ═══════════════════════════════════════════════════════
    //  BUILD TAB BAR
    // ═══════════════════════════════════════════════════════
    function mrdBuildTabs(activeIdx) {
      const scroll = document.getElementById('mrd-tab-scroll');
      scroll.innerHTML = MRD_ICONS.map((ico, i) => `
        <div class="mrd-tab${i===activeIdx?' active':''}" id="mrd-tab-${i}" onclick="mrdSwitchTab(${i})">${ico.label}</div>
      `).join('');
      // Scroll active tab into view
      setTimeout(() => {
        const activeTab = document.getElementById('mrd-tab-' + activeIdx);
        if (activeTab) activeTab.scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
      }, 50);
    }

    function mrdScrollTabs(dir) {
      const scroll = document.getElementById('mrd-tab-scroll');
      scroll.scrollBy({ left: dir * 160, behavior: 'smooth' });
    }

    // ═══════════════════════════════════════════════════════
    //  OPEN ICON / PANEL
    // ═══════════════════════════════════════════════════════
    function mrdOpenIcon(idx) {
      mrdState.activeIconIdx = idx;
      mrdState.activeCheckIdx = 0;

      // Flip animation on icon
      const cell = document.getElementById('mrd-cell-' + idx);
      if (cell) {
        cell.style.transition = 'transform 0.35s ease';
        cell.style.transform = 'rotateY(180deg)';
        setTimeout(() => {
          cell.style.transform = 'rotateY(360deg)';
          setTimeout(() => { cell.style.transform = ''; }, 350);
        }, 180);
      }

      // Show overlay + panel
      document.getElementById('mrd-overlay').classList.add('active');
      const panel = document.getElementById('mrd-checklist-panel');
      panel.style.display = 'flex';
      panel.style.flexDirection = 'column';

      mrdBuildTabs(idx);
      mrdRenderCheckpoint('forward');
    }

    function mrdSwitchTab(idx) {
      mrdState.activeIconIdx = idx;
      mrdState.activeCheckIdx = 0;
      mrdBuildTabs(idx);
      mrdRenderCheckpoint('forward');
    }

    // ═══════════════════════════════════════════════════════
    //  RENDER CHECKPOINT
    // ═══════════════════════════════════════════════════════
    function mrdRenderCheckpoint(dir) {
      const ico = MRD_ICONS[mrdState.activeIconIdx];
      const ci  = mrdState.activeCheckIdx;
      const key = mrdState.activeIconIdx + '-' + ci;
      const ans = mrdState.answers[key] || null;
      const total = ico.checks.length;

      const area = document.getElementById('mrd-checkpoint-area');
      area.innerHTML = `
        <div class="mrd-action-row">
          <button class="mrd-action-btn${ans==='na'?' selected-na':''}" onclick="mrdAnswer('na')">N/A</button>
          <button class="mrd-action-btn${ans==='pending'?' selected-pending':''}" onclick="mrdAnswer('pending')">Pending</button>
          <button class="mrd-action-btn${ans==='reviewed'?' selected-reviewed':''}" onclick="mrdAnswer('reviewed')">Reviewed</button>
          <button class="mrd-clear-btn" onclick="mrdClear()">Clear</button>
        </div>
        <div class="mrd-checkpoint-num">${ico.label} &nbsp;·&nbsp; Checkpoint ${ci+1} of ${total}</div>
        <div class="mrd-checkpoint-text mrd-slide-enter${dir==='back'?' mrd-slide-enter-rev':''}">${ico.checks[ci]}</div>
        ${ans ? `<span class="mrd-status-chip ${ans==='na'?'chip-na':ans==='pending'?'chip-pending':'chip-reviewed'}">${ans==='na'?'N/A':ans==='pending'?'⏳ Pending':'✅ Reviewed'}</span>` : ''}
      `;

      // Update progress
      mrdUpdateProgress();

      // Prev button
      const prevBtn = document.getElementById('mrd-prev-btn');
      if (prevBtn) prevBtn.disabled = (ci === 0);
    }

    // ═══════════════════════════════════════════════════════
    //  ANSWER
    // ═══════════════════════════════════════════════════════
    function mrdAnswer(val) {
      const ico = MRD_ICONS[mrdState.activeIconIdx];
      const ci  = mrdState.activeCheckIdx;
      const key = mrdState.activeIconIdx + '-' + ci;
      mrdState.answers[key] = val;

      const total = ico.checks.length;
      if (ci < total - 1) {
        // Slide to next
        mrdState.activeCheckIdx++;
        mrdRenderCheckpoint('forward');
      } else {
        mrdRenderCheckpoint('forward');
      }
    }

    function mrdClear() {
      const key = mrdState.activeIconIdx + '-' + mrdState.activeCheckIdx;
      delete mrdState.answers[key];
      mrdRenderCheckpoint('forward');
    }

    function mrdPrev() {
      if (mrdState.activeCheckIdx > 0) {
        mrdState.activeCheckIdx--;
        mrdRenderCheckpoint('back');
      }
    }

    // ═══════════════════════════════════════════════════════
    //  PROGRESS (counts na + reviewed as complete)
    // ═══════════════════════════════════════════════════════
    function mrdUpdateProgress() {
      const ico   = MRD_ICONS[mrdState.activeIconIdx];
      const iIdx  = mrdState.activeIconIdx;
      const total = ico.checks.length;
      let completed = 0;
      for (let c = 0; c < total; c++) {
        const v = mrdState.answers[iIdx + '-' + c];
        if (v === 'na' || v === 'reviewed') completed++;
      }
      const pct = total > 0 ? Math.round((completed / total) * 100) : 0;
      const fill = document.getElementById('mrd-prog-fill');
      const label = document.getElementById('mrd-prog-label');
      if (fill)  fill.style.width = pct + '%';
      if (label) label.textContent = `${completed} / ${total} completed`;
    }

    // ═══════════════════════════════════════════════════════
    //  CLOSE
    // ═══════════════════════════════════════════════════════
    function mrdClose() {
      document.getElementById('mrd-overlay').classList.remove('active');
      document.getElementById('mrd-checklist-panel').style.display = 'none';

      // If export icon was used, trigger export
      if (mrdState.activeIconIdx === 11) {
        mrdExportToExcel();
      }
    }

    // Close on overlay click
    document.getElementById('mrd-overlay').addEventListener('click', mrdClose);

    // ═══════════════════════════════════════════════════════
    //  EXCEL EXPORT (CSV format compatible with Excel)
    // ═══════════════════════════════════════════════════════
    function mrdExportToExcel() {
      const tag  = document.getElementById('inp-tag').value  || 'Unknown-Tag';
      const name = document.getElementById('inp-name').value || 'Vertical Drum';
      const po   = document.getElementById('inp-po').value   || 'N/A';
      const dt   = new Date();
      const dtStr = dt.toLocaleString();

      // CSV header
      let csv = `"Vessel","Section","Checkpoint","Status"\n`;
      csv += `"${name} (${tag})","PO: ${po}","Review Date: ${dtStr}",""\n`;

      MRD_ICONS.forEach((ico, iIdx) => {
        ico.checks.forEach((chk, ci) => {
          const key = iIdx + '-' + ci;
          const ans = mrdState.answers[key] || 'Not Reviewed';
          const statusLabel = ans === 'na' ? 'N/A' : ans === 'pending' ? 'Pending' : ans === 'reviewed' ? 'Reviewed' : 'Not Reviewed';
          csv += `"${name}","${ico.label}","${chk.replace(/"/g,'""')}","${statusLabel}"\n`;
        });
      });

      // Create blob
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const url  = URL.createObjectURL(blob);
      const fileName = `MERIDIAN_Review_${tag}_${dt.getFullYear()}${String(dt.getMonth()+1).padStart(2,'0')}${String(dt.getDate()).padStart(2,'0')}.csv`;

      // Add to exports list
      const exportEntry = { name: fileName, time: dtStr, url, tag, name: name };
      mrdState.exports.unshift(exportEntry);
      mrdRenderExports();

      // Auto-download
      const a = document.createElement('a');
      a.href = url; a.download = fileName;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
    }

    // ═══════════════════════════════════════════════════════
    //  RENDER EXPORTS IN BLOCK 3
    // ═══════════════════════════════════════════════════════
    function mrdRenderExports() {
      const leftCol  = document.getElementById('mrd-exports-left');
      const rightCol = document.getElementById('mrd-exports-right');
      if (!leftCol) return;

      const all = mrdState.exports;
      if (all.length === 0) {
        leftCol.innerHTML = '<div style="font-size:11px;color:rgba(255,255,255,0.25);padding-top:8px;">No recent exports</div>';
        rightCol.innerHTML = '';
        return;
      }

      // Split into two columns
      const left  = all.filter((_, i) => i % 2 === 0);
      const right = all.filter((_, i) => i % 2 !== 0);

      const renderItem = (e) => `
        <div class="mrd-export-item">
          <span class="mrd-export-icon">📊</span>
          <div class="mrd-export-info">
            <div class="mrd-export-name" title="${e.name}">${e.name}</div>
            <div class="mrd-export-time">${e.time}</div>
          </div>
          <button class="mrd-download-btn" onclick="mrdDownload('${e.url}','${e.name}')">↓ Download</button>
        </div>`;

      leftCol.innerHTML  = left.map(renderItem).join('') || '<div style="font-size:11px;color:rgba(255,255,255,0.25);padding-top:8px;"></div>';
      rightCol.innerHTML = right.map(renderItem).join('');
    }

    function mrdDownload(url, name) {
      const a = document.createElement('a');
      a.href = url; a.download = name;
      document.body.appendChild(a); a.click();
      document.body.removeChild(a);
    }

    // ═══════════════════════════════════════════════════════
    //  INIT
    // ═══════════════════════════════════════════════════════
    mrdBuildGrid();
    </script>
</body>
